[build-system]
requires = [
    "setuptools>=61.0.0",
    "setuptools-scm>=8.0",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "eddie-template"
version = "0.0.2"
description = "A module for EDDIE."
readme = "README.md"
authors = [{ name = "Luke Parkinson", email = "luke.parkinson@canterbury.ac.nz" }]
license = "AGPL-3.0-only"
keywords = ["EDDIE", "Digital Twin", "Geospatial"]
dependencies = [
    "aiohttp",
    "celery",
    "flask",
    "flask-cors",
    "flask_swagger_ui",
    "geoalchemy2",
    "geoapis",
    "geopandas",
    "gevent",
    "gunicorn",
    "pandas",
    "python-dotenv",
    "pywps",
    "rasterio",
    "requests",
    "shapely",
    "sqlalchemy",
]
requires-python = ">=3.11"
[project.entry-points."eddie.plugins"]
template = "eddie_template"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["eddie_template"]

[project.optional-dependencies]
dev = ["python-dotenv", "pip-tools", "pytest"]

[project.urls]
Homepage = "https://github.com/GeospatialResearch/eddie_template"
